name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Catalog identity and coverage
        run: python escota_search.py --check-catalog
      - name: Legacy extraction integrity
        run: python audit_21_swarm_dataset.py
